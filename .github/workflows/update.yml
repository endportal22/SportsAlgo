# Rebuilds every league's predictions and publishes the phone app to GitHub Pages.
# Runs every morning, every afternoon (NHL goalies, NBA injury reports and lines), on Sunday
# late morning (NFL inactives), when you press "Run workflow" on the Actions tab, and when
# new code is pushed. A league that fails to update keeps its last published predictions.
name: Update predictions

on:
  schedule:
    - cron: "0 11 * * *"     # daily, ~6am Eastern
    - cron: "0 22 * * *"     # daily, ~5pm Eastern
    - cron: "30 16 * * 0"    # Sunday, ~11:30am Eastern
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "nfl/code/**", "nhl/code/**", "nba/code/**", "shared/**", "requirements.txt", ".github/**"]

permissions:
  contents: write   # only used for the keep-alive commit below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE: https://endportal22.github.io/SportsAlgo
  TZ: America/New_York   # game dates are Eastern, so "today" should be too

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the app password is set
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          if [ -z "$APP_PASSWORD" ]; then
            echo "::error::Add a repository secret named APP_PASSWORD (Settings > Secrets and variables > Actions) before publishing."
            exit 1
          fi

      # each league keeps its downloaded data between runs
      - uses: actions/cache@v4
        with: { path: nfl/data, key: "nfl-data-${{ github.run_id }}", restore-keys: nfl-data- }
      - uses: actions/cache@v4
        with: { path: nhl/data, key: "nhl-data-${{ github.run_id }}", restore-keys: nhl-data- }
      - uses: actions/cache@v4
        with: { path: nba/data, key: "nba-data-${{ github.run_id }}", restore-keys: nba-data- }

      - name: NFL
        env: { APP_PASSWORD: "${{ secrets.APP_PASSWORD }}" }
        run: .github/scripts/build_league.sh nfl
      - name: NHL
        env: { APP_PASSWORD: "${{ secrets.APP_PASSWORD }}" }
        run: .github/scripts/build_league.sh nhl
      - name: NBA
        env: { APP_PASSWORD: "${{ secrets.APP_PASSWORD }}" }
        run: .github/scripts/build_league.sh nba

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      # GitHub pauses scheduled jobs in repos with no activity for 60 days; an empty
      # commit every ~50 days keeps the daily updates running.
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled updates running"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
