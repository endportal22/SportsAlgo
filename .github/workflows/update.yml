# Rebuilds every sport's predictions and publishes the phone app to GitHub Pages.
# Runs every morning, again on Sunday late morning (NFL inactives) and late afternoon
# (NHL starting goalies), when you press "Run workflow" on the Actions tab, and when
# new code is pushed. If one sport fails to update, the app keeps that sport's last
# published predictions instead of dropping it.
name: Update predictions

on:
  schedule:
    - cron: "0 11 * * *"     # daily, ~6am Eastern
    - cron: "30 16 * * 0"    # Sunday ~11:30am Eastern (NFL inactives)
    - cron: "0 22 * * *"     # daily ~5pm Eastern (NHL lines and goalies before puck drop)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "nfl/code/**", "nhl/code/**", "requirements.txt", ".github/workflows/**"]

permissions:
  contents: write   # only used for the keep-alive commit below
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  SITE: https://endportal22.github.io/SportsAlgo
  TZ: America/New_York   # game dates are Eastern; "today" should be too

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check the app password is set
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          if [ -z "$APP_PASSWORD" ]; then
            echo "::error::Add a repository secret named APP_PASSWORD (Settings > Secrets and variables > Actions) before publishing."
            exit 1
          fi

      # ---------------- NFL ----------------
      - uses: actions/cache@v4
        with:
          path: nfl/data
          key: nfl-data-${{ github.run_id }}
          restore-keys: nfl-data-

      - name: NFL predictions
        id: nfl
        continue-on-error: true
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          python nfl/code/update_data.py
          python nfl/code/export_app.py --out app/data/nfl

      # ---------------- NHL ----------------
      - uses: actions/cache@v4
        with:
          path: nhl/data
          key: nhl-data-${{ github.run_id }}
          restore-keys: nhl-data-

      - name: Seed NHL history (first run only)
        run: |
          if [ ! -f nhl/data/games.csv ]; then
            git fetch --depth 1 origin nhl-data-seed
            mkdir -p nhl/data
            git archive FETCH_HEAD | tar -x -C nhl/data
            echo "Seeded $(ls nhl/data | wc -l) NHL data files"
          fi

      - name: NHL predictions
        id: nhl
        continue-on-error: true
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          python nhl/code/update_data.py
          python nhl/code/export_app.py --out app/data/nhl

      # ---------------- fall back to the last published data for any sport that failed ----------------
      - name: Keep last good data for failed sports
        if: steps.nfl.outcome != 'success' || steps.nhl.outcome != 'success'
        run: |
          for lg in nfl nhl; do
            outcome=$([ "$lg" = nfl ] && echo "${{ steps.nfl.outcome }}" || echo "${{ steps.nhl.outcome }}")
            if [ "$outcome" != "success" ]; then
              echo "::warning::$lg update failed; republishing its last published data"
              rm -rf "app/data/$lg"; mkdir -p "app/data/$lg"
              if curl -fsS "$SITE/data/$lg/files.json" -o "app/data/$lg/files.json"; then
                for f in $(python -c "import json;print(' '.join(json.load(open('app/data/$lg/files.json'))))"); do
                  curl -fsS "$SITE/data/$lg/$f" -o "app/data/$lg/$f" || echo "missing $f"
                done
              else
                echo "::warning::no published $lg data to fall back on"
              fi
            fi
          done

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

      # GitHub pauses scheduled jobs in repos with no activity for 60 days; an empty
      # commit every ~50 days keeps the daily updates running.
      - name: Keep schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled updates running"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
